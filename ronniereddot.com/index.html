<!DOCTYPE html>
<!-- A single "Coming Soon" page for ronniereddot.com.
     Everything (text and styling) lives in this one file to keep it simple. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ronnie Red Dot | Coming Soon</title>
  <meta name="description" content="ronniereddot.com is coming soon.">
  <style>
    /* Fill the whole screen and center the content both ways */
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 0 16px;
    }
    /* The red dot */
    .dot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e0262b;
      margin: 0 auto 28px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      margin: 0 0 12px;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      font-size: 1.1rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <main>
    <div class="dot"></div>
    <h1>Coming Soon</h1>
    <p>ronniereddot.com</p>
  </main>
</body>
</html>
